name: "Task / Sub-Issue / Tech Debt"
description: "Vertical slice, child task, or tech-debt ticket"
title: "task(<scope>): <summary>"
labels: ["type:task"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for vertical slice tickets, child tasks of an Epic or Feature, and tech-debt work.

        **Do not paste parent or blocker numbers into the body.** Set them natively after creating the issue:
        open the issue sidebar → *Relationships* → *Parent issue* / *Blocked by*.
        Body text duplicates the native graph and drifts out of sync.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: "Why this exists and what it unblocks (free text, no issue-number placeholders)"
      placeholder: "Link to the plan, spec, or ADR that motivated this ticket..."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: "Describe the end-to-end behavior to build (avoid layer-by-layer file inventories)"
      placeholder: "Concise description of the end-to-end behavior delivered..."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: "Checklist of observable acceptance criteria"
      value: |
        - [ ]
    validations:
      required: true
