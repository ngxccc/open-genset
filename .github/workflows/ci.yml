name: CI

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
      - ".vscode/**"

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-consistency:
    name: "Version Consistency"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Check workspace manifest versions
        run: bun scripts/version.ts check

  quality-gate:
    name: "Quality Gate"
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/integration.yml
    secrets: inherit
