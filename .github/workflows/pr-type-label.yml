name: "PR Type Label"

# The release notes group pull requests by label, so the label has to say what
# the change is, not which files it touched. File paths answer "where" (the
# labeler's `area:*` labels); the conventional-commit prefix answers "what".
#
# `pull_request_target` because labeling needs a write token, and no pull
# request code is checked out here.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-type-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: "Label from conventional commit prefix"
    runs-on: ubuntu-latest
    steps:
      - name: "Keep exactly one type label in sync with the title"
        uses: actions/github-script@v9
        with:
          script: |
            const PREFIX_TO_LABEL = {
              feat: "type:feat",
              fix: "type:fix",
              perf: "type:perf",
              refactor: "type:refactor",
              docs: "type:docs",
              test: "type:test",
              ci: "type:ci",
              chore: "type:chore",
              build: "type:chore",
              style: "type:style",
            };
            const MANAGED = new Set(Object.values(PREFIX_TO_LABEL));

            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            const match = /^(\w+)(?:\([^)]*\))?!?:/.exec(pr.title);
            const wanted = match && PREFIX_TO_LABEL[match[1].toLowerCase()];

            if (!wanted) {
              core.info(`"${pr.title}" has no conventional prefix; leaving type labels alone.`);
              return;
            }

            const current = pr.labels.map((label) => label.name);

            for (const name of current) {
              if (!MANAGED.has(name) || name === wanted) continue;
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: pr.number,
                  name,
                });
                core.info(`Removed ${name}`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            if (!current.includes(wanted)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels: [wanted],
              });
              core.info(`Added ${wanted}`);
            }
