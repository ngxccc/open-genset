<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Midnight Obsidian (Monochrome Navy Undertone) -->
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#060A12"/>
    </linearGradient>

    <!-- Signature Corporate Navy (Current Primary) -->
    <linearGradient id="primaryNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#002C6C"/>
    </linearGradient>

    <!-- Deep Navy Slate (Canopy & Chassis) -->
    <linearGradient id="navySlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Steel Roof Plate -->
    <linearGradient id="steelRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#navyBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- CENTRAL EMBLEM: MINIMALIST INDUSTRIAL GENSET IN MONOCHROME NAVY -->
  <g transform="translate(256, 260)">
    <!-- Base Skid / Chassis (Chân đế máy công nghiệp) -->
    <path d="M -140 100 L 140 100 L 130 120 L -130 120 Z" fill="#0A0E17" stroke="#1E293B" stroke-width="2"/>
    <rect x="-80" y="105" width="36" height="9" rx="2" fill="#060A12" stroke="#1E293B"/>
    <rect x="44" y="105" width="36" height="9" rx="2" fill="#060A12" stroke="#1E293B"/>

    <!-- Main Acoustic Soundproof Canopy (Vỏ máy chống ồn công nghiệp) -->
    <rect x="-130" y="-35" width="260" height="135" rx="6" fill="url(#navySlate)" stroke="#334155" stroke-width="2"/>

    <!-- Left Ventilation Louvers (5 khe hút gió tản nhiệt két nước) -->
    <g fill="#0A0E17" stroke="#1E293B" stroke-width="1">
      <rect x="-116" y="-12" width="64" height="10" rx="2"/>
      <rect x="-116" y="6" width="64" height="10" rx="2"/>
      <rect x="-116" y="24" width="64" height="10" rx="2"/>
      <rect x="-116" y="42" width="64" height="10" rx="2"/>
      <rect x="-116" y="60" width="64" height="10" rx="2"/>
    </g>

    <!-- Canopy Division Seam (Đường phân tách cửa bảo trì) -->
    <line x1="-36" y1="-35" x2="-36" y2="100" stroke="#334155" stroke-width="1.5"/>

    <!-- Right Smart Controller Cockpit Window (Màn hình điều khiển phẳng) -->
    <rect x="-18" y="-15" width="134" height="95" rx="6" fill="#060A12" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="-8" y="5" width="114" height="48" rx="4" fill="#0B1324" stroke="#1E293B" stroke-width="1"/>

    <!-- Real-time IoT Telemetry Sine Wave in Primary Blue (Sóng xung nhịp IoT) -->
    <path d="M -2 29 L 16 29 L 26 14 L 38 42 L 48 20 L 58 34 L 68 29 L 100 29"
          fill="none" stroke="url(#primaryNavy)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Top Canopy Roof (Clean flush beveled roof plate) -->
    <path d="M -135 -35 L 135 -35 L 122 -52 L -122 -52 Z" fill="url(#steelRoof)" stroke="#475569" stroke-width="1.5"/>
    <!-- Recessed Roof Vents -->
    <line x1="-80" y1="-43" x2="-20" y2="-43" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="-43" x2="80" y2="-43" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>

    <!-- Symmetrical Centered IoT Telemetry Signal Waves -->
    <path d="M -25 -68 A 25 25 0 0 1 25 -68" fill="none" stroke="url(#primaryNavy)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -45 -82 A 45 45 0 0 1 45 -82" fill="none" stroke="url(#primaryNavy)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7"/>
    <path d="M -65 -96 A 65 65 0 0 1 65 -96" fill="none" stroke="url(#primaryNavy)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.4"/>
  </g>
</svg>
