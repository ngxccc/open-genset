name: "Bug Report"
description: "File an actionable bug report with reproduction steps"
title: "fix(<scope>): <summary>"
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report a bug, unexpected behavior, or crash.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: "Clear and concise description of the bug and what was expected to happen"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: "Minimal steps to reproduce the behavior"
      value: |
        1. 
        2. 
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "OS, version, and relevant logs"
      value: |
        - OS / Version:
        - Logs / Output:
    validations:
      required: true
